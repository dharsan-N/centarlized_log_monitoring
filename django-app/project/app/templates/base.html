{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Monitoring — Security Analytics Platform</title>
    <meta name="description" content="Centralized log monitoring and security analytics platform.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app">
    <!-- Mobile Hamburger Menu Button -->
    <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
                <div class="logo-text">
                    <h1>Log Monitoring</h1>
                    <span>Security Analytics v2.0</span>
                </div>
            </div>
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">
                <i class="fas fa-bars" id="sidebar-toggle-icon"></i>
            </button>
        </div>
        <nav class="nav" id="sidebar-nav">
            <button class="nav-item active" data-section="overview" onclick="showSection('overview')" title="Overview">
                <i class="fas fa-chart-pie"></i><span class="nav-label">Overview</span>
            </button>
            <button class="nav-item" data-section="servers" onclick="showSection('servers')" title="Servers">
                <i class="fas fa-server"></i><span class="nav-label">Servers</span>
            </button>
            <button class="nav-item" data-section="logs" onclick="showSection('logs')" title="Live Logs">
                <i class="fas fa-scroll"></i><span class="nav-label">Live Logs</span>
            </button>
            <button class="nav-item" data-section="threats" onclick="showSection('threats')" title="Threat Alerts">
                <i class="fas fa-bug"></i><span class="nav-label">Threat Alerts</span>
            </button>
            <button class="nav-item" data-section="blocked-ips" onclick="showSection('blocked-ips')" title="Blocked IPs">
                <i class="fas fa-ban"></i><span class="nav-label">Blocked IPs</span>
            </button>
            <button class="nav-item" data-section="actions" onclick="showSection('actions')" title="Security Actions">
                <i class="fas fa-shield-alt"></i><span class="nav-label">Security Actions</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <span class="status-dot" id="system-status-dot"></span>
            <span class="nav-label" id="system-status-text">System Online</span>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main" id="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<div class="toast" id="toast"></div>
{% csrf_token %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
